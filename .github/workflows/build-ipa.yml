name: Build iOS IPA

# 在 GitHub 托管的 macOS 环境中自动构建随心所阅 IPA
# 触发方式：push 到 main / 手动点击 Actions 里的 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest      # GitHub 提供的免费 macOS 镜像（含 Xcode）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 诊断环境
        run: |
          echo "macOS $(sw_vers -productVersion)"
          flutter --version
          xcodebuild -version

      - name: 生成干净的 iOS 原生工程并注入源码
        # 先在空目录生成标准工程，再注入我们的 lib / assets / pubspec，避免覆盖源码
        run: |
          flutter create --platforms=ios --org com.niki --project-name xxread buildios
          cp -R lib/. buildios/lib/
          mkdir -p buildios/assets
          cp -R assets/. buildios/assets/
          cp pubspec.yaml buildios/pubspec.yaml
          cp ios/Runner/Info.plist buildios/ios/Runner/Info.plist
          # 删除 flutter create 生成的默认测试文件（引用占位包名，无意义且会报 analyze 错误）
          rm -rf buildios/test
          # 提高 iOS 部署目标，避免新版 Flutter 插件的最低版本报错
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [\d.]+/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" buildios/ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e "s/platform :ios, ['\"]?[\d.]+['\"]?/platform :ios, '15.0'/" buildios/ios/Podfile

      - name: 获取 Flutter 依赖
        run: |
          cd buildios
          flutter pub get

      - name: 分析代码（仅输出诊断，不阻断构建）
        run: |
          cd buildios
          flutter analyze 2>&1 | tee analyze.log || true

      - name: 构建 App（无签名 .app）
        # 使用 flutter build ios --no-codesign 只编译生成 .app，不做签名归档导出。
        # 这样绕过 flutter build ipa 强制要求 Development Team 的限制。
        run: |
          cd buildios
          flutter build ios --release --no-codesign 2>&1 | tee build.log
          echo "=== 查找生成的 .app ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null
          ls -la build/ios/iphoneos/ 2>/dev/null || true

      - name: 手动打包 IPA（未签名）
        # 把 .app 按标准 IPA 结构压缩：Payload/Runner.app -> .ipa
        run: |
          cd buildios
          APP=$(find build/ios -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 Runner.app，Xcode 编译可能失败"
            grep -iE "error|failed|exception" build.log | head -60 || true
            exit 1
          fi
          echo "使用 .app 路径: $APP"
          mkdir -p build/ios/ipa ipa_stage/Payload
          cp -R "$APP" ipa_stage/Payload/Runner.app
          cd ipa_stage
          zip -qry "../build/ios/ipa/随心所阅-3.1.520.ipa" Payload
          cd ..
          ls -lh build/ios/ipa/
          echo "IPA 打包完成"

      - name: 上传 IPA 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 随心所阅-3.1.520-ipa
          path: buildios/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: 上传诊断日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-logs
          path: |
            buildios/build.log
            buildios/analyze.log
          if-no-files-found: ignore
