name: Build iOS IPA

# 在 GitHub 托管的 macOS 环境中自动构建随心所阅 IPA
# 触发方式：push 到 main / 手动点击 Actions 里的 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest      # GitHub 提供的免费 macOS 镜像（含 Xcode）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 诊断环境
        run: |
          echo "macOS $(sw_vers -productVersion)"
          flutter --version
          xcodebuild -version

      - name: 生成干净的 iOS 原生工程并注入源码
        # 先在空目录生成标准工程，再注入我们的 lib / assets / pubspec，避免覆盖源码
        run: |
          flutter create --platforms=ios --org com.niki --project-name xxread buildios
          cp -R lib/. buildios/lib/
          mkdir -p buildios/assets
          cp -R assets/. buildios/assets/
          cp pubspec.yaml buildios/pubspec.yaml
          cp ios/Runner/Info.plist buildios/ios/Runner/Info.plist
          # 提高 iOS 部署目标，避免新版 Flutter 插件的最低版本报错
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [\d.]+/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" buildios/ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e "s/platform :ios, ['\"]?[\d.]+['\"]?/platform :ios, '15.0'/" buildios/ios/Podfile

      - name: 获取 Flutter 依赖
        run: |
          cd buildios
          flutter pub get

      - name: 分析代码（仅输出诊断，不阻断构建）
        run: |
          cd buildios
          flutter analyze 2>&1 | tee analyze.log || true

      - name: 构建 Release IPA（无签名）
        # flutter build ipa 内部会自动执行 pod install，无需手动 --repo-update
        run: |
          cd buildios
          flutter build ipa --release --no-codesign 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "========== 构建失败，错误摘要 =========="
            grep -iE "error|failed|exception|not found|undefined|isn't defined|cannot" build.log | head -60 || true
            exit "$STATUS"
          fi

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: 随心所阅-3.1.520-ipa
          path: buildios/build/ios/ipa/*.ipa
          if-no-files-found: error
