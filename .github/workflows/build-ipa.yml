name: Build iOS IPA

# 在 GitHub 托管的 macOS 环境中自动构建随心所阅 IPA（未签名）
# 触发方式：push 到 main / 手动点击 Actions 里的 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 生成 iOS 工程并注入源码
        run: |
          flutter create --platforms=ios --org com.niki --project-name xxread buildios
          cp -R lib/. buildios/lib/
          mkdir -p buildios/assets
          cp -R assets/. buildios/assets/
          cp pubspec.yaml buildios/pubspec.yaml
          cp ios/Runner/Info.plist buildios/ios/Runner/Info.plist
          rm -rf buildios/test
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [\d.]+/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" buildios/ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e "s/platform :ios, ['\"]?[\d.]+['\"]?/platform :ios, '15.0'/" buildios/ios/Podfile

      - name: 获取 Flutter 依赖
        run: |
          cd buildios
          flutter pub get

      - name: 安装 CocoaPods 依赖
        # 不用 --repo-update（那会更新数百 MB 仓库导致超时），用 runner 自带的 specs
        run: |
          cd buildios/ios
          pod install

      - name: 用 xcodebuild 编译（完全禁用签名）
        # 绕过 flutter build 命令强制要求 Development Team 的限制，直接调用 xcodebuild
        run: |
          cd buildios/ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/../build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee ../xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild 退出码: $STATUS"
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::xcodebuild 错误"
            grep -iE "error|failed|fatal" ../xcodebuild.log | head -60 || true
            echo "::endgroup::"
            exit "$STATUS"
          fi
          echo "=== 查找编译产物 ==="
          find "$PWD/../build/ios/derived" -name "Runner.app" -type d

      - name: 手动打包 IPA
        run: |
          cd buildios
          APP=$(find build/ios/derived -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 Runner.app 编译产物"
            exit 1
          fi
          if [ ! -f "$APP/Runner" ]; then
            echo "::error::Runner.app 缺少可执行文件 Runner（空包）"
            ls -la "$APP"
            exit 1
          fi
          echo "使用: $APP"
          du -sh "$APP"
          mkdir -p build/ios/ipa ipa_stage/Payload
          cp -R "$APP" ipa_stage/Payload/Runner.app
          cd ipa_stage
          zip -qry "../build/ios/ipa/随心所阅-3.1.520.ipa" Payload
          cd ..
          ls -lh build/ios/ipa/
          echo "IPA 打包完成"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: 随心所阅-3.1.520-ipa
          path: buildios/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: buildios/xcodebuild.log
          if-no-files-found: ignore
